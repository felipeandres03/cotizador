services:
  backend:
    build:
      context: ./backend
    image: cotizador-backend
    container_name: cotizador-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: cotizador-frontend
    container_name: cotizador-frontend-container
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
